name: Deploy Docs Site

# Builds the docs site (docs/, Astro Starlight) with the embedded Storybook and
# deploys it to the Cloudflare Worker that serves https://nova.sun-asterisk.com
# (see docs/wrangler.jsonc and docs/auth-worker.js).
#
# Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # wrangler requires Node >= 22
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook + Docs site
        run: pnpm build:all
      - name: Deploy to Cloudflare Workers
        run: pnpm deploy:docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
